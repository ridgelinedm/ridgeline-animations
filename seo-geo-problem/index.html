<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEO/GEO Problem — Competitor Gap Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet">
<style>
  :root {
    --rdm-night: #01172F;
    --rdm-ash: #BAC1B8;
    --rdm-fern: #65743A;
    --rdm-rust: #AF4319;
    --rdm-rust-bright: #D55428;
    --rdm-cream: #F4EFE6;
    --rdm-white: #FFFFFF;
    --rdm-surface: #FAFAF8;
    --rdm-text-muted: #6B7280;
    --rdm-text-fade: #9CA3AF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    background: var(--rdm-white);
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* Subtle grid backdrop */
  .stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(1, 23, 47, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(1, 23, 47, 0.035) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
    pointer-events: none;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dashboard {
    position: relative;
    width: min(900px, 100%);
    height: min(560px, 95%);
  }

  /* Main chart card */
  .chart-card {
    width: 100%;
    height: 100%;
    background: var(--rdm-surface);
    border: 1px solid rgba(1, 23, 47, 0.10);
    border-radius: 14px;
    padding: 34px 36px;
    box-shadow:
      0 20px 50px rgba(1, 23, 47, 0.08),
      0 8px 20px rgba(1, 23, 47, 0.04);
    opacity: 0;
    animation: cardFadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
    display: flex;
    flex-direction: column;
  }

  @keyframes cardFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
    gap: 20px;
    flex-shrink: 0;
  }

  .chart-title-block {
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.6s forwards;
    min-width: 0;
  }

  .chart-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--rdm-rust);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .chart-label::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--rdm-rust);
    box-shadow: 0 0 0 0 rgba(175, 67, 25, 0.6);
    animation: pulse 1.8s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(175, 67, 25, 0.7); }
    70%  { box-shadow: 0 0 0 8px rgba(175, 67, 25, 0); }
    100% { box-shadow: 0 0 0 0 rgba(175, 67, 25, 0); }
  }

  .chart-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--rdm-night);
    letter-spacing: -0.015em;
    line-height: 1.2;
  }

  .chart-subtitle {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--rdm-text-muted);
    margin-top: 4px;
    font-weight: 500;
  }

  /* Stats block — pulled into header instead of floating cards */
  .header-stats {
    display: flex;
    gap: 28px;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.85s forwards;
    flex-shrink: 0;
  }

  .stat {
    text-align: right;
  }

  .stat-num {
    font-family: 'DM Sans', sans-serif;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .stat-num.competitor { color: var(--rdm-rust); }
  .stat-num.you { color: var(--rdm-text-fade); }

  .stat-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 9px;
    color: var(--rdm-text-muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-top: 4px;
    font-weight: 600;
  }

  /* Chart area */
  .chart-area {
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 0;
  }

  .chart-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .y-label {
    fill: var(--rdm-text-muted);
    font-size: 10px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    opacity: 0;
    animation: fadeIn 0.5s ease-out 0.9s forwards;
  }

  .x-label {
    fill: var(--rdm-text-muted);
    font-size: 10px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    letter-spacing: 0.05em;
    opacity: 0;
  }
  .x-label-1 { animation: fadeIn 0.4s ease-out 1.0s forwards; }
  .x-label-2 { animation: fadeIn 0.4s ease-out 1.15s forwards; }
  .x-label-3 { animation: fadeIn 0.4s ease-out 1.3s forwards; }
  .x-label-4 { animation: fadeIn 0.4s ease-out 1.45s forwards; }
  .x-label-5 { animation: fadeIn 0.4s ease-out 1.6s forwards; }
  .x-label-6 { animation: fadeIn 0.4s ease-out 1.75s forwards; }

  .grid-line {
    stroke: rgba(1, 23, 47, 0.06);
    stroke-width: 1;
    stroke-dasharray: 3 4;
    opacity: 0;
    animation: fadeIn 0.5s ease-out 0.7s forwards;
  }

  /* "You" noisy spiky line */
  .line-you {
    fill: none;
    stroke: #7B8290;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1600;
    stroke-dashoffset: 1600;
    opacity: 0.9;
    animation: drawYou 2.4s cubic-bezier(0.65, 0, 0.35, 1) 1.2s forwards;
  }

  /* "Competitor" climbing line — bold, rust */
  .line-competitor {
    fill: none;
    stroke: var(--rdm-rust);
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1800;
    stroke-dashoffset: 1800;
    animation: drawCompetitor 2.6s cubic-bezier(0.65, 0, 0.35, 1) 1.5s forwards;
  }

  /* Gradient fill under competitor line */
  .competitor-fill {
    fill: url(#compGrad);
    opacity: 0;
    animation: fadeFill 1.2s ease-out 3.6s forwards;
  }

  @keyframes drawYou {
    to { stroke-dashoffset: 0; }
  }
  @keyframes drawCompetitor {
    to { stroke-dashoffset: 0; }
  }
  @keyframes fadeFill { to { opacity: 0.15; } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Endpoint markers */
  .endpoint-you {
    fill: var(--rdm-text-fade);
    stroke: var(--rdm-surface);
    stroke-width: 2;
    opacity: 0;
    animation: pointIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 3.6s forwards;
  }

  .endpoint-competitor {
    fill: var(--rdm-rust);
    stroke: var(--rdm-surface);
    stroke-width: 2;
    opacity: 0;
    animation: pointPulse 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 4.1s forwards;
  }

  .endpoint-ring {
    fill: none;
    stroke: var(--rdm-rust);
    stroke-width: 1.5;
    opacity: 0;
    animation: ringExpand 1.2s ease-out 4.1s forwards;
  }

  @keyframes pointIn {
    from { opacity: 0; transform: scale(0); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes pointPulse {
    0%   { opacity: 0; transform: scale(0); }
    60%  { opacity: 1; transform: scale(1.6); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes ringExpand {
    0%   { opacity: 0; r: 4; }
    50%  { opacity: 0.5; r: 18; }
    100% { opacity: 0.25; r: 24; }
  }

  /* Inline labels on the lines */
  .line-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0;
  }
  .line-label-competitor {
    fill: var(--rdm-rust);
    animation: fadeIn 0.5s ease-out 4.3s forwards;
  }
  .line-label-you {
    fill: var(--rdm-text-muted);
    animation: fadeIn 0.5s ease-out 3.8s forwards;
  }

  /* Footer caption inside the card */
  .chart-footer {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid rgba(1, 23, 47, 0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 4.5s forwards;
  }

  .footer-caption {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--rdm-night);
    font-weight: 500;
    line-height: 1.4;
  }

  .footer-caption .emph {
    color: var(--rdm-rust);
    font-weight: 700;
  }

  .footer-meta {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    color: var(--rdm-text-muted);
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Responsive */
  @media (max-width: 700px) {
    .chart-header { flex-direction: column; }
    .header-stats { align-self: flex-end; gap: 18px; }
    .stat-num { font-size: 20px; }
    .chart-title { font-size: 18px; }
    .chart-footer { flex-direction: column; align-items: flex-start; }
  }

  /* Respect reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="scene">
    <div class="dashboard">

      <div class="chart-card">
        <div class="chart-header">
          <div class="chart-title-block">
            <div class="chart-label">12-Month Search Visibility</div>
            <div class="chart-title">Where the demand is going</div>
            <div class="chart-subtitle">Organic clicks · You vs. your nearest competitor</div>
          </div>
          <div class="header-stats">
            <div class="stat">
              <div class="stat-num you">Flat</div>
              <div class="stat-label">Your Growth · 12mo</div>
            </div>
            <div class="stat">
              <div class="stat-num competitor">↑ Compounding</div>
              <div class="stat-label">Their Growth · 12mo</div>
            </div>
          </div>
        </div>

        <div class="chart-area">
          <svg class="chart-svg" viewBox="0 0 800 320" preserveAspectRatio="none">
            <defs>
              <linearGradient id="compGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#AF4319" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#AF4319" stop-opacity="0"/>
              </linearGradient>
            </defs>

            <!-- Y-axis labels -->
            <text class="y-label" x="0" y="40">HIGH</text>
            <text class="y-label" x="0" y="200">MID</text>
            <text class="y-label" x="0" y="280">LOW</text>

            <!-- Grid lines -->
            <line class="grid-line" x1="40" y1="40" x2="800" y2="40"/>
            <line class="grid-line" x1="40" y1="200" x2="800" y2="200"/>
            <line class="grid-line" x1="40" y1="280" x2="800" y2="280"/>

            <!-- X-axis labels -->
            <text class="x-label x-label-1" x="80" y="310" text-anchor="middle">12 MO AGO</text>
            <text class="x-label x-label-2" x="220" y="310" text-anchor="middle">10 MO</text>
            <text class="x-label x-label-3" x="360" y="310" text-anchor="middle">8 MO</text>
            <text class="x-label x-label-4" x="500" y="310" text-anchor="middle">6 MO</text>
            <text class="x-label x-label-5" x="640" y="310" text-anchor="middle">3 MO</text>
            <text class="x-label x-label-6" x="760" y="310" text-anchor="middle">TODAY</text>

            <!-- Competitor fill -->
            <path class="competitor-fill" d="M 80,265 C 130,260 170,250 220,235 C 270,220 310,195 360,170 C 410,150 450,130 500,105 C 550,85 590,65 640,50 C 690,35 720,28 760,22 L 760,290 L 80,290 Z"/>

            <!-- "Your" noisy spiky line — drawn first, behind -->
            <!-- Hovers around y=270-285, with occasional spikes to y=255-265 mimicking real GSC data -->
            <path class="line-you" d="M 80,285 L 95,285 L 105,275 L 115,283 L 125,285 L 135,278 L 145,272 L 155,285 L 165,283 L 175,265 L 185,270 L 195,285 L 205,285 L 215,280 L 225,272 L 235,265 L 245,283 L 255,285 L 265,278 L 275,285 L 285,275 L 295,282 L 305,285 L 315,272 L 325,285 L 335,283 L 345,270 L 355,285 L 365,278 L 375,265 L 385,283 L 395,285 L 405,272 L 415,285 L 425,280 L 435,275 L 445,285 L 455,283 L 465,268 L 475,278 L 485,285 L 495,275 L 505,283 L 515,272 L 525,285 L 535,278 L 545,283 L 555,270 L 565,285 L 575,283 L 585,275 L 595,285 L 605,272 L 615,283 L 625,278 L 635,285 L 645,275 L 655,283 L 665,260 L 675,275 L 685,285 L 695,278 L 705,283 L 715,272 L 725,285 L 735,275 L 745,283 L 760,278"/>

            <!-- "Competitor" climbing line — drawn second, in front -->
            <path class="line-competitor" d="M 80,265 C 130,260 170,250 220,235 C 270,220 310,195 360,170 C 410,150 450,130 500,105 C 550,85 590,65 640,50 C 690,35 720,28 760,22"/>

            <!-- Inline labels next to endpoints -->
            <text class="line-label line-label-you" x="745" y="270" text-anchor="end">YOU</text>
            <text class="line-label line-label-competitor" x="745" y="14" text-anchor="end">COMPETITOR</text>

            <!-- Endpoint: You -->
            <circle class="endpoint-you" cx="760" cy="278" r="4"/>

            <!-- Endpoint: Competitor -->
            <circle class="endpoint-ring" cx="760" cy="22" r="4"/>
            <circle class="endpoint-competitor" cx="760" cy="22" r="6"/>
          </svg>
        </div>

        <div class="chart-footer">
          <div class="footer-caption">
            They're showing up in the searches <span class="emph">you should be winning</span>.
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
